[package]
name = "httpf"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
bytes = "1.10.1"
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive"] }
colored = "3.0.0"
cookie = "0.18.1"
dirs = "6.0.0"
env_logger = "0.11.8"
futures = { version = "0.3.31", default-features = false }
glob = "0.3.2"
http = "1.3.1"
http-body-util = "0.1.3"
humantime = "2.2.0"
hyper = { version = "1.6.0", features = ["http1", "server"] }
hyper-rustls = "0.27.7"
hyper-util = { version = "0.1.14", features = ["client-legacy", "http1"] }
ipnet = { version = "2.11.0", features = ["serde"] }
jsfuck = "1.0.6"
log = "0.4.27"
pin-project-lite = "0.2.16"
rand = "0.9.1"
regex = "1.11.1"
rusqlite = { version = "0.36.0", features = ["chrono"] }
rustls = "0.23.28"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.45.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["tls12"] }
url = { version = "2.5.4", features = ["serde"] }
